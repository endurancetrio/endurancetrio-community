<html data-th-lang="${#locale.language}" lang="en" class="has-endurance-navbar-fixed-top">
<head data-th-replace="~{fragments/head :: head(${metadata})}">
  <title></title>
</head>

<body>
<template data-th-replace="~{fragments/head :: googleTagManager}"></template>

<nav data-th-replace="~{fragments/main-navbar :: main-navbar(${metadata})}"></nav>

<main>
  <section class="hero has-background-grey-300">
    <div class="hero-body">
      <div class="container is-fullhd">
        <h1 data-th-text="#{page.athletes.title}" class="title is-1">Athletes</h1>
        <p data-th-text="#{page.athletes.subtitle}" class="subtitle is-3">
          Profiles, races, and results
        </p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="endurance-box is-branded-thin is-branded-faded has-background-grey-200">
      <div class="columns is-multiline">
        <div class="column is-half-tablet is-narrow-desktop">
          <div class="buttons has-addons is-centered">
            <a data-th-href="${genderUrls['ALL']}"
               data-th-text="#{page.athletes.filter.all}"
               data-th-classappend="${filter.gender() == null} ? 'is-selected is-primary'"
               class="button is-small">
            </a>
            <a data-th-href="${genderUrls['MALE']}"
               data-th-text="#{page.athletes.filter.male}"
               data-th-classappend="${filter.gender()?.getCode() == 'MALE'} ? 'is-selected is-primary'"
               class="button is-small">
            </a>
            <a data-th-href="${genderUrls['FEMALE']}"
               data-th-classappend="${filter.gender()?.getCode() == 'FEMALE'} ? 'is-selected is-primary'"
               data-th-text="#{page.athletes.filter.female}"
               class="button is-small">
            </a>
          </div>
        </div>

        <div class="column is-half-tablet is-narrow-desktop">
          <div class="buttons has-addons is-centered">
            <a data-th-href="${letterRangeUrls['ALL']}"
               data-th-text="#{page.athletes.filter.all}"
               data-th-classappend="${filter.letterRange() == null} ? 'is-selected is-primary'"
               class="button is-small">
            </a>
            <span data-th-if="${range.athleteCount() == 0}"
                  data-th-each="range : ${letterRanges}"
                  data-th-text="${#strings.replace(range.id(), '_', '-')}"
                  aria-disabled="true"
                  class="button is-small is-disabled">
            </span>
            <a data-th-unless="${range.athleteCount() == 0}"
               data-th-each="range : ${letterRanges}"
               data-th-href="${letterRangeUrls[range.id()]}"
               data-th-text="${#strings.replace(range.id(), '_', '-')}"
               data-th-classappend="${filter.letterRange() == range.id()} ? 'is-selected is-primary'"
               class="button is-small">
            </a>
          </div>
        </div>

        <div class="column">
          <form method="get" data-th-action="@{/{lang}/athletes(lang=${language})}" role="search">
            <div class="field has-addons">
              <div class="control is-expanded">
                <label for="athlete-search" class="label is-sr-only"
                       data-th-text="#{page.athletes.search.placeholder}">Search athletes</label>
                <input id="athlete-search"
                       data-th-value="${filter.searchTerm()}"
                       data-th-placeholder="#{page.athletes.search.placeholder}"
                       type="search"
                       name="q"
                       class="input is-small">
              </div>
              <div class="control">
                <button data-th-attr="aria-label=${#messages.msg('page.athletes.search.submit')}"
                        type="submit"
                        class="button is-small is-primary">
                  <span class="icon"><i class="et et-magnify"></i></span>
                  <span data-th-text="#{page.athletes.search.submit}">Search</span>
                </button>
              </div>
            </div>
            <input data-th-if="${filter.letterRange() != null}"
                   data-th-value="${filter.letterRange()}"
                   type="hidden"
                   name="letterRange">
            <input data-th-if="${filter.gender() != null}"
                   data-th-value="${filter.gender().getCode()}"
                   type="hidden"
                   name="gender">
          </form>
        </div>
      </div>

      <div class="level">
        <div class="level-left">
          <div data-th-if="${pagination.totalItems() > 0}" class="level-item">
            <span data-th-text="#{page.athletes.results(${pagination.totalItems()})}">
            </span>
          </div>
          <div data-th-unless="${pagination.totalItems() > 0}" class="level-item has-text-centered-mobile">
            <span data-th-text="${isFiltered ? #messages.msg('page.athletes.empty.filtered') : #messages.msg('page.athletes.empty')}">
            </span>
          </div>
        </div>
        <div  data-th-if="${isFiltered}" class="level-right">
          <div class="level-item">
            <a data-th-href="${athletesUrl}"
               data-th-text="#{page.athletes.filter.clear}"
               class="button is-small is-dark">
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="fixed-grid has-1-cols-mobile has-3-cols-desktop">
      <div class="grid">
        <div data-th-each="athlete : ${athletes}" class="cell">
          <a data-th-href="@{/{lang}/athletes/{id}(lang=${language}, id=${athlete.id()})}">
            <div class="box mb-2">
              <article class="media">
                <div class="media-left">
                  <div class="endurance-box has-text-centered p-3">
                  <span class="icon is-large">
                    <i data-th-class="|et ${athlete.gender() != null ? (athlete.gender().name() == 'MALE' ? 'et-face-man' : 'et-face-woman') : 'et-head-cog-outline'}|"></i>
                  </span>
                  </div>
                </div>

                <div class="media-content">
                  <div class="content">
                    <span data-th-text="${athlete.knownName() != null && !athlete.knownName().isEmpty() ? athlete.knownName() : athlete.longName()}"
                       class="title is-4"
                    >
                    </span>
                    <br>
                    <span data-th-if="${athlete.country != null}"
                          data-th-text="${athlete.country().getCode()}"
                          class="subtitle is-6"
                    >
                    </span>
                    <span class="icon-text">
                      <span data-th-if="${athlete.country != null && athlete.yearOfBirth() !=null}"
                            class="icon"
                      >
                        <i class="et et-tally-mark-1"></i>
                      </span>
                    </span>
                    <span data-th-if="${athlete.yearOfBirth() != null}"
                          data-th-text="${athlete.yearOfBirth()}"
                          class="subtitle is-6"
                    >
                    </span>
                  </div>
                </div>
              </article>
            </div>
          </a>
        </div>
      </div>
    </div>

    <nav class="pagination is-centered" role="navigation" aria-label="pagination"
         data-th-if="${pagination.totalPages() > 1}">
      <a data-th-classappend="${!pagination.hasPrevious()} ? 'is-disabled'"
         data-th-attr="disabled=${!pagination.hasPrevious()} ? 'disabled' : null"
         data-th-href="${paginationPreviousUrl}"
         class="pagination-previous"
      >
        <span class="icon">
          <i class="et et-chevron-double-left"></i>
        </span>
      </a>

      <a data-th-classappend="${!pagination.hasNext()} ? 'is-disabled'"
         data-th-attr="disabled=${!pagination.hasNext()} ? 'disabled' : null"
         data-th-href="${paginationNextUrl}"
         class="pagination-next"
      >
        <span class="icon">
          <i class="et et-chevron-double-right"></i>
        </span>
      </a>

      <ul class="pagination-list">
        <li data-th-if="${pageWindow.gapBefore()}">
          <span class="pagination-ellipsis">&hellip;</span>
        </li>
        <li data-th-each="p : ${pageWindow.pages()}">
          <a data-th-classappend="${p == pagination.pageNumber()} ? 'is-current'"
             data-th-attr="aria-label=${'Goto page ' + (p + 1)}"
             data-th-text="${p + 1}"
             data-th-href="${paginationUrls.get(p)}"
             class="pagination-link"
          >1</a>
        </li>
        <li data-th-if="${pageWindow.gapAfter()}">
          <span class="pagination-ellipsis">&hellip;</span>
        </li>
      </ul>
    </nav>
  </section>
</main>

<footer data-th-replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
