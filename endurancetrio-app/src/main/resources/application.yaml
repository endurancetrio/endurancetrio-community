app:
  copyright-year: 2011-2026
  featured-article-ids: ${FEATURED_ARTICLE_IDS:1,2}
  featured-event-article-id: ${FEATURED_EVENT_ARTICLE_ID:3}
  featured-event-ids: ${FEATURED_EVENT_IDS:300001,300002,300003,300004}
  initialization:
    first-account-owner: ${FIRST_OWNER:}
    first-account-key-hash: ${FIRST_HASH:}
  google:
    adsense-id: ${GOOGLE_ADSENSE_ID:}
  kofi:
    user-id: ${KOFI_USER_ID:}
  open-graph:
    default-img: /img/endurancetrio-open-graph.png
    default-img-height: 628
    default-img-width: 1200
  site-url: ${SITE_URL:https://endurancetrio.com}
  social:
    facebook-page-id: ${FACEBOOK_PAGE_ID:}
    twitter-site: ${TWITTER_SITE:}
  version: @project.version@

cors:
  # IMPORTANT: Use a comma-separated string for deployment flexibility.
  # This value is easily overridden by the environment variable CORS_ALLOWED_ORIGINS
  allowed-origins: "http://localhost:3000,http://localhost:8080"

kit:
  api-base-url: https://api.kit.com
  api-key: ${KIT_API_KEY:}
  api-key-header: X-Kit-Api-Key
  api-version: v4
  form-id-en: ${KIT_FORM_ID_EN:}
  form-id-pt: ${KIT_FORM_ID_PT:}
  path-form-subscribers: /forms/{formId}/subscribers/{subscriberId}
  path-subscribers: /subscribers

logging:
  level:
    org.hibernate.engine.transaction.jta.platform.internal.JtaPlatformInitiator: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%-5level] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true

server:
  forward-headers-strategy: native
  port: 8080

spring:
  application:
    name: EnduranceTrio Community

  config:
    import: optional:application-secrets.yaml

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: EnduranceTrio-HikariPool
      connection-test-query: SELECT 1
      connection-timeout: 30000
      idle-timeout: 600000
      keepalive-time: 300000
      maximum-pool-size: 3
      max-lifetime: 1800000
      minimum-idle: 1
      transaction-isolation: TRANSACTION_READ_COMMITTED

  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    enabled: true
    locations:
      - classpath:db/migration/ddl/postgres
      - classpath:db/migration/dml/postgres
    out-of-order: true
    placeholders:
      timezone: UTC
    schemas: endurancetrio_hub
    table: flyway_schema_history
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
    properties:
      hibernate:
        default_schema: endurancetrio_hub
        format_sql: true
        jdbc:
          time_zone: UTC
        show_sql: false
        transaction:
          jta:
            coordinator_class: jdbc
        use_sql_comments: true

  messages:
    basename: messages
    encoding: UTF-8

  sql:
    init:
      mode: never

  thymeleaf:
    enabled: true
    prefix: classpath:/templates/
    suffix: .html
